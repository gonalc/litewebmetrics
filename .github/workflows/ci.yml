name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test, build & size check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Runs inject-version, bundles, type declarations and the bundle size check
      - name: Build
        run: bun run build
        env:
          # Placeholder only: inlined into bundles that CI discards
          ANALYTICS_ENDPOINT: https://example.invalid/api/events

      - name: Check src/version.ts matches package.json
        run: |
          if ! git diff --exit-code src/version.ts; then
            echo "::error file=src/version.ts::src/version.ts is out of sync with package.json. Run 'bun run prebuild' and commit the result."
            exit 1
          fi

      - name: Bundle size summary
        if: always()
        run: |
          {
            echo "## Bundle sizes"
            echo ""
            echo "| File | Raw | Gzip (-9) |"
            echo "| --- | ---: | ---: |"
            for f in dist/*.js; do
              [ -f "$f" ] || continue
              raw=$(wc -c < "$f" | tr -d ' ')
              gz=$(gzip -9 -c "$f" | wc -c | tr -d ' ')
              echo "| \`$(basename "$f")\` | ${raw} B | ${gz} B |"
            done
            echo ""
            echo "Core bundle (\`analytics.min.js\`) limit: 3072 B gzipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore
